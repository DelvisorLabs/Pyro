[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyro"
version = "0.1.0"
description = "Python client for the self-hosted Pyro gateway"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/pyro"]
