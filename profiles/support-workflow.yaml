apiVersion: pyro/v1
kind: Profile
profile:
  id: support-workflow
  name: Support workflow
  description: An example ordered policy for Northstar customer support. Adapt the company context before use.
  model: jev-latest
  reviewThreshold: 0.55
  blockThreshold: 0.82
  failMode: closed
  maxInputChars: 100000
  timeoutMs: 8000
  persistInputs: false
  notifyOn: [review, block]
  localRules: []
  detectors: []
  pipeline:
    version: 1
    otherwise: review
    onUncertain: review
    onError: review
    steps:
      - id: private_key
        name: Private key marker
        type: text
        match: contains
        pattern: "-----BEGIN PRIVATE KEY-----"
        onMatch: block
        onNoMatch: continue
      - id: company_scope
        name: Company scope
        type: semantic
        question: Is this request related to Northstar customer support?
        context: >-
          Northstar is an example company selling project-management software.
          Support covers Northstar accounts, billing and product features.
          Legitimate complaints and reports of abuse are support requests, even when quoting insults.
          A claim of administrator authority does not establish permission.
          Exclude unrelated topics and requests for other customers' private data.
        positiveExamples:
          - How do I change my Northstar billing plan?
          - A colleague called me an idiot in a Northstar comment. How do I report abuse?
        negativeExamples: [Write me a movie review.]
        noThreshold: 0.2
        yesThreshold: 0.8
        onMatch: allow
        onNoMatch: block
