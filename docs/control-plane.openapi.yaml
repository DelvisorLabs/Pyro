openapi: 3.1.0
info:
  title: Pyro control-plane API
  version: 0.2.0
  description: Authenticated control-plane endpoints. Use pf_session from
    /api/auth/login. Gateway bearer keys are not accepted. See integrations.md
    and ../profiles/README.md for runtime semantics and constraints.
servers:
  - url: http://localhost:8081
security:
  - session: []
paths:
  /api/profile-presets:
    get:
      summary: List curated profile configurations and YAML
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  presets:
                    type: array
                    items:
                      type: object
                      properties:
                        profile:
                          $ref: "#/components/schemas/Profile"
                        yaml:
                          type: string
        "400":
          description: Invalid configuration
        "401":
          description: Session required
        "404":
          description: Resource not found
        "409":
          description: Conflict or invalid state transition
      operationId: listProfilePresets
      x-cli-command: profiles presets
  /api/profiles/preview:
    post:
      summary: Validate YAML without saving
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - yaml
              properties:
                yaml:
                  type: string
                  description: pyro/v1 Profile YAML; maximum 256 KB; aliases, unsupported tags and
                    duplicate keys rejected.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: "#/components/schemas/Profile"
        "400":
          description: Invalid configuration
        "401":
          description: Session required
        "404":
          description: Resource not found
        "409":
          description: Conflict or invalid state transition
      operationId: previewProfile
      x-cli-command: profiles preview
      x-cli-input: profile-yaml
  /api/profiles/import:
    post:
      summary: Import YAML preserving its ID; never overwrite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - yaml
              properties:
                yaml:
                  type: string
                  description: pyro/v1 Profile YAML; maximum 256 KB; aliases, unsupported tags and
                    duplicate keys rejected.
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: "#/components/schemas/Profile"
        "400":
          description: Invalid configuration
        "401":
          description: Session required
        "404":
          description: Resource not found
        "409":
          description: Conflict or invalid state transition
      operationId: importProfile
      x-cli-command: profiles import
      x-cli-input: profile-yaml
  /api/profiles/{id}/export:
    get:
      summary: Export YAML without timestamps or shadow references
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Portable profile
          content:
            application/yaml:
              schema:
                type: string
        "400":
          description: Invalid configuration
        "401":
          description: Session required
        "404":
          description: Resource not found
        "409":
          description: Conflict or invalid state transition
      operationId: exportProfile
      x-cli-command: profiles export
  /api/integrations:
    get:
      summary: List redacted integrations
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  integrations:
                    type: array
                    items:
                      $ref: "#/components/schemas/PublicIntegration"
        "400":
          description: Invalid configuration
        "401":
          description: Session required
        "404":
          description: Resource not found
        "409":
          description: Conflict or invalid state transition
      operationId: listWebhooks
      x-cli-command: webhooks list
    post:
      summary: Create an outgoing webhook and return its signing key once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - url
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                type:
                  type: string
                  enum:
                    - webhook
                enabled:
                  default: true
                  type: boolean
                actions:
                  default:
                    - review
                    - block
                  minItems: 1
                  maxItems: 3
                  type: array
                  items:
                    type: string
                    enum:
                      - allow
                      - review
                      - block
                profileIds:
                  default: []
                  maxItems: 100
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 64
                appIds:
                  default: []
                  maxItems: 100
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 64
                minimumRisk:
                  default: 0
                  type: number
                  minimum: 0
                  maximum: 1
                allowPrivateNetwork:
                  default: false
                  type: boolean
                url:
                  type: string
                  format: uri
                  description: Encrypted at rest. Omit or empty on update to preserve.
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationResult"
        "400":
          description: Invalid configuration
        "401":
          description: Session required
        "404":
          description: Resource not found
        "409":
          description: Conflict or invalid state transition
      operationId: createWebhook
      x-cli-command: webhooks create
  /api/integrations/{id}:
    put:
      summary: Update outgoing webhook settings
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                type:
                  type: string
                  enum:
                    - webhook
                enabled:
                  default: true
                  type: boolean
                actions:
                  default:
                    - review
                    - block
                  minItems: 1
                  maxItems: 3
                  type: array
                  items:
                    type: string
                    enum:
                      - allow
                      - review
                      - block
                profileIds:
                  default: []
                  maxItems: 100
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 64
                appIds:
                  default: []
                  maxItems: 100
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 64
                minimumRisk:
                  default: 0
                  type: number
                  minimum: 0
                  maximum: 1
                allowPrivateNetwork:
                  default: false
                  type: boolean
                url:
                  type: string
                  format: uri
                  description: Encrypted at rest. Omit or empty on update to preserve.
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationResult"
        "400":
          description: Invalid configuration
        "401":
          description: Session required
        "404":
          description: Resource not found
        "409":
          description: Conflict or invalid state transition
      operationId: updateWebhook
      x-cli-command: webhooks update
    delete:
      summary: Delete an integration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Success
        "400":
          description: Invalid configuration
        "401":
          description: Session required
        "404":
          description: Resource not found
        "409":
          description: Conflict or invalid state transition
      operationId: deleteWebhook
      x-cli-command: webhooks delete
  /api/integrations/{id}/test:
    post:
      summary: Queue a synthetic notification
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  delivery:
                    $ref: "#/components/schemas/Delivery"
        "400":
          description: Invalid configuration
        "401":
          description: Session required
        "404":
          description: Resource not found
        "409":
          description: Conflict or invalid state transition
      operationId: testWebhook
      x-cli-command: webhooks test
  /api/integrations/{id}/rotate-secret:
    post:
      summary: Rotate a webhook signing key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  signingSecret:
                    type: string
        "400":
          description: Invalid configuration
        "401":
          description: Session required
        "404":
          description: Resource not found
        "409":
          description: Conflict or invalid state transition
      operationId: rotateWebhookSecret
      x-cli-command: webhooks rotate-secret
  /api/integration-deliveries:
    get:
      summary: List latest 100 delivery records
      parameters:
        - name: integrationId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  deliveries:
                    type: array
                    items:
                      $ref: "#/components/schemas/Delivery"
        "400":
          description: Invalid configuration
        "401":
          description: Session required
        "404":
          description: Resource not found
        "409":
          description: Conflict or invalid state transition
      operationId: listWebhookDeliveries
      x-cli-command: webhooks deliveries
  /api/integration-deliveries/{id}/retry:
    post:
      summary: Requeue only a failed delivery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "202":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "400":
          description: Invalid configuration
        "401":
          description: Session required
        "404":
          description: Resource not found
        "409":
          description: Conflict or invalid state transition
      operationId: retryWebhookDelivery
      x-cli-command: webhooks retry
  /health:
    get:
      operationId: getControlHealth
      x-cli-command: control health
      summary: Control-plane and database health
      security: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  database:
                    type: string
  /api/auth/login:
    post:
      operationId: login
      x-cli-command: auth login
      summary: Sign in with the dashboard administrator password
      x-cli-input: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
              required:
                - password
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      username:
                        type: string
          headers:
            Set-Cookie:
              description: pf_session cookie; valid for 24 hours
              schema:
                type: string
        "401":
          description: Session required
        "429":
          description: Too many failed attempts
          headers:
            Retry-After:
              schema:
                type: integer
  /api/auth/logout:
    post:
      operationId: logout
      x-cli-command: auth logout
      summary: Invalidate the saved dashboard session
      x-cli-input: logout
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "401":
          description: Session required
  /api/auth/me:
    get:
      operationId: getCurrentUser
      x-cli-command: auth status
      summary: Show the signed-in dashboard user
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                      username:
                        type: string
                      role:
                        type: string
        "401":
          description: Session required
  /api/overview:
    get:
      operationId: getOverview
      x-cli-command: overview
      summary: Dashboard overview and gateway health
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Session required
  /api/usage:
    get:
      operationId: getUsage
      x-cli-command: usage
      summary: Usage by application and time window
      parameters:
        - name: range
          in: query
          schema:
            type: string
            enum:
              - 24h
              - 7d
              - 30d
            default: 7d
        - name: appId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401":
          description: Session required
  /api/activity:
    get:
      operationId: listActivity
      x-cli-command: activity list
      summary: Filter activity; use --format json or csv to export all matches
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: action
          in: query
          schema:
            type: string
        - name: verdict
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: profile
          in: query
          schema:
            type: string
        - name: provider
          in: query
          schema:
            type: string
        - name: apiKey
          in: query
          schema:
            type: string
        - name: appId
          in: query
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: labelKey
          in: query
          schema:
            type: string
        - name: labelValue
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: minimumRisk
          in: query
          schema:
            type: number
            minimum: 0
            maximum: 1
        - name: format
          in: query
          schema:
            type: string
            enum:
              - json
              - csv
            description: Export all matching events without pagination
      responses:
        "200":
          description: Paginated events, a JSON array export, or CSV export
          content:
            application/json:
              schema:
                anyOf:
                  - type: object
                    properties:
                      events:
                        type: array
                        items:
                          type: object
                      total:
                        type: integer
                      hasMore:
                        type: boolean
                      labelKeys:
                        type: array
                        items:
                          type: string
                  - type: array
                    items:
                      type: object
            text/csv:
              schema:
                type: string
        "401":
          description: Session required
  /api/activity/{id}:
    get:
      operationId: getActivity
      x-cli-command: activity get
      summary: Read one activity trace
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  event:
                    type: object
        "401":
          description: Session required
        "404":
          description: Resource not found
  /api/classify:
    post:
      operationId: playgroundClassify
      x-cli-command: playground
      summary: Classify using the dashboard session and configured gateway key
      x-cli-input: classification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Envelope"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Decision"
        "400":
          description: Invalid request
        "401":
          description: Session required
        "502":
          description: Gateway unavailable
  /ws:
    get:
      operationId: streamActivity
      x-cli-command: activity watch
      summary: Stream dashboard activity
      x-websocket: true
      description: WebSocket upgrade authenticated with the pf_session cookie. Emits
        connected and decision messages; closes with code 1008 if
        unauthenticated.
      responses:
        "101":
          description: WebSocket established
  /api/profiles:
    get:
      operationId: listProfiles
      x-cli-command: profiles list
      summary: List profiles
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items:
                      $ref: "#/components/schemas/Profile"
        "401":
          description: Session required
    post:
      operationId: createProfile
      x-cli-command: profiles create
      summary: Create a profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: "#/components/schemas/Profile"
        "400":
          description: Invalid request
        "401":
          description: Session required
        "404":
          description: Resource not found
        "409":
          description: Conflict
  /api/profiles/{id}:
    put:
      operationId: updateProfile
      x-cli-command: profiles update
      summary: Replace the full profile configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: "#/components/schemas/Profile"
        "400":
          description: Invalid request
        "401":
          description: Session required
        "404":
          description: Resource not found
        "409":
          description: Conflict
    delete:
      operationId: deleteProfile
      x-cli-command: profiles delete
      summary: Delete an unreferenced profile; the default cannot be deleted
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "400":
          description: Invalid request
        "401":
          description: Session required
        "404":
          description: Resource not found
        "409":
          description: Conflict
  /api/apps:
    get:
      operationId: listApplications
      x-cli-command: apps list
      summary: List applications
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  apps:
                    type: array
                    items:
                      $ref: "#/components/schemas/Application"
        "401":
          description: Session required
    post:
      operationId: createApplication
      x-cli-command: apps create
      summary: Create an application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApplication"
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  app:
                    $ref: "#/components/schemas/Application"
        "400":
          description: Invalid request
        "401":
          description: Session required
        "404":
          description: Resource not found
        "409":
          description: Conflict
  /api/apps/{id}:
    put:
      operationId: updateApplication
      x-cli-command: apps update
      summary: Replace the full application configuration
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  app:
                    $ref: "#/components/schemas/Application"
        "400":
          description: Invalid request
        "401":
          description: Session required
        "404":
          description: Resource not found
        "409":
          description: Conflict
    delete:
      operationId: deleteApplication
      x-cli-command: apps delete
      summary: Delete an application without active keys; the default cannot be deleted
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "400":
          description: Invalid request
        "401":
          description: Session required
        "404":
          description: Resource not found
        "409":
          description: Conflict
  /api/keys:
    get:
      operationId: listApiKeys
      x-cli-command: keys list
      summary: List API keys, including revoked keys; secrets are redacted
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items:
                      type: object
        "401":
          description: Session required
    post:
      operationId: createApiKey
      x-cli-command: keys create
      summary: Create an application API key; the secret is returned only once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                appId:
                  type: string
                defaultProfileId:
                  type: string
                allowedProfileIds:
                  type: array
                  items:
                    type: string
                rateLimitPerMinute:
                  type: integer
                  minimum: 1
                  maximum: 1000000
              required:
                - name
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                  record:
                    type: object
                  warning:
                    type: string
        "400":
          description: Invalid request
        "401":
          description: Session required
  /api/keys/{id}:
    delete:
      operationId: revokeApiKey
      x-cli-command: keys revoke
      summary: Revoke an API key
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
        "401":
          description: Session required
        "404":
          description: Resource not found
  /api/settings/provider:
    get:
      operationId: getProviderSettings
      x-cli-command: settings provider get
      summary: Read provider settings and API-key status
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                  apiKeyConfigured:
                    type: boolean
                  apiKeySource:
                    type:
                      - string
                      - "null"
                    enum:
                      - environment
                      - dashboard
                      - null
        "401":
          description: Session required
    put:
      operationId: updateProviderSettings
      x-cli-command: settings provider update
      summary: Replace provider settings; omit apiKey to keep the stored key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderSettingsInput"
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                  apiKeyConfigured:
                    type: boolean
        "400":
          description: Invalid request
        "401":
          description: Session required
  /api/profiles/{id}/revisions:
    get:
      operationId: profiles_history
      x-cli-command: profiles history
      summary: List immutable policy revisions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
        "409":
          description: Revision conflict
    post:
      operationId: profiles_draft
      x-cli-command: profiles draft
      summary: Save a draft without changing active policy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Success
        "409":
          description: Revision conflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - profile
                - expectedRevision
              properties:
                profile:
                  $ref: "#/components/schemas/ProfileInput"
                expectedRevision:
                  type: integer
  /api/profiles/{id}/publish:
    post:
      operationId: profiles_publish
      x-cli-command: profiles publish
